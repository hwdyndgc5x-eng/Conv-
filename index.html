<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ссылка для отзыва 2GIS</title>
<style>
:root{--bg:#f4f7f4;--fg:#14211a;--mut:#5b6b62;--card:#fff;--line:#cfd9d2;--acc:#1a9b4a;--accfg:#fff;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a14;--fg:#e8f1ea;--mut:#9bb0a2;--card:#18261e;--line:#2b3d32;--acc:#37c46b;--accfg:#08210f;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#101a14;--fg:#e8f1ea;--mut:#9bb0a2;--card:#18261e;--line:#2b3d32;--acc:#37c46b;--accfg:#08210f;--err:#ff8a80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:20px 16px 40px;max-width:560px;margin-inline:auto}
h1{font-size:22px;margin:8px 0 6px}
p{color:var(--mut);margin:0 0 16px}
textarea{width:100%;min-height:130px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;resize:vertical}
.row{display:flex;gap:10px;margin:12px 0 20px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 16px;background:var(--acc);color:var(--accfg);flex:1}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line);flex:0 0 auto}
.res{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.res code{display:block;word-break:break-all;font:15px/1.4 ui-monospace,Menlo,monospace;margin-bottom:10px}
.res .src{color:var(--mut);font-size:14px;margin-bottom:6px}
.res.bad{border-color:var(--err)}
.res.bad .src{color:var(--err)}
</style>
</head>
<body>
<h1>Ссылка для отзыва 2GIS</h1>
<p>Вставьте ссылку на организацию из 2GIS. Можно сразу несколько, каждую с новой строки.</p>
<textarea id="in" placeholder="https://2gis.kz/almaty/geo/70000001109800896/..."></textarea>
<div class="row">
  <button id="go">Получить ссылку</button>
  <button class="sec" id="clr">Очистить</button>
</div>
<div id="out"></div>
<script>
function extract(s){
  var m = s.match(/\/(\d{10,})(?=[\/?&#]|$)/);
  if(!m){ m = s.match(/^\s*(\d{10,})\s*$/); }
  return m ? m[1] : null;
}
function copyText(t, btn){
  var done=function(){ var o=btn.textContent; btn.textContent="Скопировано"; setTimeout(function(){btn.textContent=o;},1500); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done,fallback); }
    else fallback();
  }catch(e){ fallback(); }
  function fallback(){
    var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){}
    document.body.removeChild(ta);
  }
}
document.getElementById("go").onclick=function(){
  var out=document.getElementById("out"); out.innerHTML="";
  var lines=document.getElementById("in").value.split(/\n+/).map(function(x){return x.trim();}).filter(Boolean);
  lines.forEach(function(line){
    var id=extract(line);
    var box=document.createElement("div"); box.className="res"+(id?"":" bad");
    var src=document.createElement("div"); src.className="src";
    src.textContent = id ? "ID: "+id : "Не нашёл ID в этой ссылке: "+line.slice(0,60);
    box.appendChild(src);
    if(id){
      var url="https://2gis.kz/reviews/"+id+"/addReview?utm_source=1k";
      var c=document.createElement("code"); c.textContent=url; box.appendChild(c);
      var b=document.createElement("button"); b.textContent="Скопировать"; b.onclick=function(){copyText(url,b);}; box.appendChild(b);
    }
    out.appendChild(box);
  });
};
document.getElementById("clr").onclick=function(){
  document.getElementById("in").value=""; document.getElementById("out").innerHTML="";
};
</script>
</body>
</html>
